services:
  db:
    image: postgres:15-alpine
    container_name: brahminet-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: brahminet
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: brahminet-qdrant
    ports:
      - "6333:6333" 
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage

  minio:
    image: minio/minio
    container_name: brahminet-minio
    ports:
      - "9000:9000" 
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data

